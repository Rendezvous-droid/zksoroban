name: ci

on:
  push:
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm test --workspace=sdk

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build --workspace=sdk
      - run: npm run lint --workspace=demo

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - run: cargo test --manifest-path contracts/verifier-interface/Cargo.toml --locked
      # `cargo test --manifest-path contracts/verifier/Cargo.toml` below
      # picks up every test target under that manifest, including
      # tests/cost_regression.rs — which needs the release wasm to already
      # exist (it measures the real compiled contract, not the native Rust
      # test harness; see docs/performance.md's "CI Cost Regression Check",
      # per zksoroban#74). So this has to run *before* that test step, not
      # after — the cost check isn't a separate step, it's already part of
      # the test run below.
      - name: Build verifier release wasm
        run: cargo build --manifest-path contracts/verifier/Cargo.toml --target wasm32v1-none --release --locked
      - run: cargo test --manifest-path contracts/verifier/Cargo.toml --locked
      - run: cargo test --manifest-path contracts/registry/Cargo.toml --locked
      - run: cargo test --manifest-path contracts/examples/proof-gate/Cargo.toml --locked

  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install circom
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/circom" https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x "$HOME/.local/bin/circom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: circom --version
      - run: npm install
      - run: npm run test:circuits
